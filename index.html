const VN_PANGRAMS=['Trăm năm trong cõi người ta, chữ tài chữ mệnh khéo là ghét nhau.','Đêm khuya văng vẳng trống canh dồn, trơ cái hồng nhan với nước non.'];
const VN_TONES=['̀','́','̉','̃','̣'];
function vnRows(){const rows=[...'aăâeêioôơuưy'].map(v=>{const l=[v,...VN_TONES.map(t=>(v+t).normalize('NFC'))].join(' ');return l.toUpperCase()+'   '+l;});rows.push('Đ đ');return rows;}
function vnBlock(family){
 const box=document.createElement('div');box.className='vn-sample';
 const h=document.createElement('h3');h.textContent='Mẫu tiếng Việt';box.append(h);
 for(const p of VN_PANGRAMS){const d=document.createElement('div');d.className='pangram';d.style.fontFamily=family;d.textContent=p;box.append(d);}
 for(const r of vnRows()){const d=document.createElement('div');d.className='row';d.style.fontFamily=family;d.textContent=r;box.append(d);}
 return box;
}
const main=document.getElementById('content');
const previewInput=document.getElementById('previewText');
const defaultSample=previewInput.value;
const samples=[];
function getPreviewText(){return previewInput.value.trim()?previewInput.value:defaultSample;}
function updateSamples(){for(const sample of samples){sample.textContent=getPreviewText();}}
for(const font of fonts){
 const link=document.createElement('a');link.href='#'+font.family;link.textContent=font.name;document.querySelector('nav').append(link);
 const section=document.createElement('section');section.id=font.family;
 const head=document.createElement('div');head.className='section-head';
 const title=document.createElement('h2');title.textContent=font.name;
 const count=document.createElement('span');count.className='count';count.textContent=font.chars.length+' ký tự';head.append(title,count);
 const grid=document.createElement('div');grid.className='grid';
 for(const item of font.chars){
  const code='U+'+item.cp.toString(16).toUpperCase().padStart(4,'0');
  const cell=document.createElement('div');cell.className='cell';cell.title=code+' · '+item.name;
  const glyph=document.createElement('span');glyph.className='glyph';glyph.style.fontFamily=font.family;
  const char=String.fromCodePoint(item.cp);
  if(/^[\s\p{Cc}\p{Cf}]$/u.test(char)){glyph.className='invisible';glyph.style.fontFamily='';glyph.textContent=item.cp===32?'Khoảng trắng':item.cp===160?'Không ngắt': 'Ẩn / điều khiển';}else{glyph.textContent=char;}
  const label=document.createElement('span');label.className='code';label.textContent=code;
  cell.append(glyph,label);grid.append(cell);
 }
 const sample=document.createElement('div');sample.className='font-preview';sample.style.fontFamily=font.family;
 sample.textContent=getPreviewText();samples.push(sample);
 section.append(head,sample);if(font.name.endsWith('-vn'))section.append(vnBlock(font.family));section.append(grid);main.append(section);
}
previewInput.addEventListener('input',updateSamples);
const footer=document.createElement('footer');footer.textContent='Font được tải từ t-root.github.io/ct-squarefont • Các ô khoảng trắng và ký tự ẩn được ghi chú riêng.';main.append(footer);
